# Builds the static copy of the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not ci): the lock file is written by a newer npm than the runner's and ci rejects it
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: node scripts/build-static.mjs
        env:
          # Site address. Change the repository variable SITE_URL when a custom domain is attached.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
